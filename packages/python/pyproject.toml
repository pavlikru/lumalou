[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "lumalou-gld09"
version = "0.2.1"
description = "Fork of stramanu/lumalou: local BLE control for the Fisher-Price Lumalou (gld09), with strict reads and device-key binding (imports as lumalou)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Emanuele Strazzullo" }]
maintainers = [{ name = "Pavel Maltsev" }]
keywords = ["fisher-price", "lumalou", "ble", "bluetooth", "bleak", "reverse-engineering", "gld09"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Home Automation",
  "Framework :: AsyncIO",
]
dependencies = ["bleak>=0.22", "cryptography>=41"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.urls]
Homepage = "https://github.com/pavlikru/lumalou"
Source = "https://github.com/pavlikru/lumalou"
Changelog = "https://github.com/pavlikru/lumalou/blob/v0.2.1/packages/python/CHANGELOG.md"
Upstream = "https://github.com/stramanu/lumalou"

[project.scripts]
lumalou = "lumalou.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["lumalou*"]

[tool.setuptools.package-data]
lumalou = ["THIRD_PARTY_NOTICES.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
