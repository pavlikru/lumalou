[project]
name = "lumalou-hw-probe"
version = "0"
description = "Opt-in hardware probe CLI for the Fisher-Price Lumalou (gld09); not published"
requires-python = ">=3.10"
dependencies = ["lumalou-gld09", "bleak>=0.22"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.uv]
package = false

[tool.uv.sources]
lumalou-gld09 = { path = "../../packages/python", editable = true }

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_probe.py"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "I", "B", "UP", "SIM", "RUF"]
